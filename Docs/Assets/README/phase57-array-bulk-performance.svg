<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560"
     role="img" aria-labelledby="title description">
  <title id="title">Phase 57.11C 数组批量通道相对 Puerts TArray 的加速</title>
  <desc id="description">
    五进程正式测试中，AvidScript bulk 相对 Puerts V8 TArray Reflection 的 P50 加速，
    从一个元素的 1.40 倍增长到 1024 个元素的 52.49 倍。横轴为对数刻度，越高越好。
  </desc>
  <style>
    .title { fill: #f0f6fc; font: 700 25px "Segoe UI", Arial, sans-serif; }
    .subtitle { fill: #9da7b1; font: 14px "Segoe UI", Arial, sans-serif; }
    .label { fill: #e6edf3; font: 600 14px "Segoe UI", Arial, sans-serif; }
    .value { fill: #26c596; font: 700 13px "Segoe UI", Arial, sans-serif; }
    .axis { fill: #9da7b1; font: 11px "Segoe UI", Arial, sans-serif; }
    .footer { fill: #8b949e; font: 12px "Segoe UI", Arial, sans-serif; }
    .grid { stroke: #30363d; stroke-width: 1; }
    .bar { fill: #26c596; }
    .base { fill: #25303a; }
  </style>

  <rect width="960" height="560" rx="12" fill="#0d1117"/>
  <text class="title" x="36" y="42">Phase 57.11C Array Bulk</text>
  <text class="subtitle" x="36" y="67">相对 Puerts V8 UE TArray Reflection 的 P50 加速，对数刻度，越高越好</text>

  <line class="grid" x1="220" y1="92" x2="220" y2="490"/>
  <line class="grid" x1="330" y1="92" x2="330" y2="490"/>
  <line class="grid" x1="440" y1="92" x2="440" y2="490"/>
  <line class="grid" x1="550" y1="92" x2="550" y2="490"/>
  <line class="grid" x1="660" y1="92" x2="660" y2="490"/>
  <line class="grid" x1="770" y1="92" x2="770" y2="490"/>
  <line class="grid" x1="880" y1="92" x2="880" y2="490"/>

  <text class="axis" x="220" y="510" text-anchor="middle">1x</text>
  <text class="axis" x="330" y="510" text-anchor="middle">2x</text>
  <text class="axis" x="440" y="510" text-anchor="middle">4x</text>
  <text class="axis" x="550" y="510" text-anchor="middle">8x</text>
  <text class="axis" x="660" y="510" text-anchor="middle">16x</text>
  <text class="axis" x="770" y="510" text-anchor="middle">32x</text>
  <text class="axis" x="880" y="510" text-anchor="middle">64x</text>

  <text class="label" x="36" y="128">N = 1</text>
  <rect class="base" x="220" y="108" width="660" height="24" rx="3"/>
  <rect class="bar" x="220" y="108" width="53" height="24" rx="3"/>
  <text class="value" x="285" y="125">1.40x</text>

  <text class="label" x="36" y="196">N = 4</text>
  <rect class="base" x="220" y="176" width="660" height="24" rx="3"/>
  <rect class="bar" x="220" y="176" width="99" height="24" rx="3"/>
  <text class="value" x="331" y="193">1.86x</text>

  <text class="label" x="36" y="264">N = 16</text>
  <rect class="base" x="220" y="244" width="660" height="24" rx="3"/>
  <rect class="bar" x="220" y="244" width="203" height="24" rx="3"/>
  <text class="value" x="435" y="261">3.59x</text>

  <text class="label" x="36" y="332">N = 64</text>
  <rect class="base" x="220" y="312" width="660" height="24" rx="3"/>
  <rect class="bar" x="220" y="312" width="363" height="24" rx="3"/>
  <text class="value" x="595" y="329">9.87x</text>

  <text class="label" x="36" y="400">N = 256</text>
  <rect class="base" x="220" y="380" width="660" height="24" rx="3"/>
  <rect class="bar" x="220" y="380" width="515" height="24" rx="3"/>
  <text class="value" x="747" y="397">25.66x</text>

  <text class="label" x="36" y="468">N = 1024</text>
  <rect class="base" x="220" y="448" width="660" height="24" rx="3"/>
  <rect class="bar" x="220" y="448" width="629" height="24" rx="3"/>
  <text class="value" x="861" y="465">52.49x</text>

  <text class="footer" x="36" y="540">
    5 processes x 21 timed samples | 1890 samples | full-hash correct | UE5.8 Win64 Development
  </text>
</svg>
